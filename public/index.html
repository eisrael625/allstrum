                "@type": "Question",
                "name": "How much does AllStrum cost?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "AllStrum is still in development, so an exact price isn't available yet. Pricing will range from $150-$250 for the device itself, or $450-$550 for a device-and-guitar package. You can reserve your place in line today with a fully refundable deposit — $50 for a device, or $100 for a device-and-guitar package — and we'll follow up with concrete details as soon as we're ready to ship."
                }
              },
              {
                "@type": "Question",
                "name": "Is AllStrum only for people with disabilities?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. AllStrum was born in the adaptive community, but it's for anyone who wants to play. It's a learning tool for beginners, a motivating aid in physical and occupational therapy, and a way to keep casual players strumming — Fender's research found that 90% of new guitar owners quit within their first year. AllStrum removes the steepest part of the learning curve so you're playing real songs from day one."
                }
              },
              {
                "@type": "Question",
                "name": "How is AllStrum different from ChordBuddy?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "ChordBuddy only supports a limited set of chords, so you can't play complex songs or choose your key — and it still requires the dexterity and cognitive ability to know each chord and transition between them yourself. AllStrum holds chords down for you automatically in real time from the app: pick a song, choose your key, and just strum."
                }
              },
              {
                "@type": "Question",
                "name": "What instruments does AllStrum work with?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "AllStrum attaches to a real guitar or ukulele — you're playing an actual instrument, not a toy or a simulator."
                }
              },
              {
                "@type": "Question",
                "name": "Do I need any musical experience?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "None at all. The companion app handles the chords while you strum, so you can play a real song in your very first session. The fun part is that you will keep getting better as you play: your strumming pattern, sense of rhythm, and timing all improve, taking you from beginner to intermediate in no time."
                }
              },
              {
                "@type": "Question",
                "name": "Can AllStrum be used as a learning tool?",
                "acceptedAnswer": {
                  "@type": "Answer",

                }
